name: CI

on:
  push:
    branches: [ main, prod-hardening ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Lint & Test (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release, Debug]
        include:
          - compiler: gcc
            cxx_compiler: g++
          - compiler: clang
            cxx_compiler: clang++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies & tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang clang-format ninja-build

      - name: Code Formatting Check
        if: matrix.compiler == 'clang' && matrix.build_type == 'Release'
        run: |
          find include src tests benchmarks -name '*.hpp' -o -name '*.cpp' | xargs clang-format --dry-run --Werror

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }} \
            ${{ matrix.compiler == 'gcc' && matrix.build_type == 'Debug' && '-DENABLE_COVERAGE=ON' || '' }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run Test Suite
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

      - name: Verify code coverage (>=80% on all source files)
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        run: |
          python3 -c "
          import subprocess, sys, glob
          objs = glob.glob('build/CMakeFiles/kem_core.dir/src/*.o')
          out = subprocess.check_output(['gcov', '-n'] + objs, text=True)
          lines = out.splitlines()
          failed = False
          checked = 0
          for i, line in enumerate(lines):
              if 'File \'' in line and 'src/' in line:
                  exec_line = lines[i+1]
                  pct = float(exec_line.split(':')[1].split('%')[0])
                  fname = line.split('\'')[1]
                  print(f'{fname}: {pct}%')
                  checked += 1
                  if pct < 80.0:
                      print(f'FAIL: {fname} coverage {pct}% < 80%')
                      failed = True
          if checked == 0:
              print('ERROR: No coverage files found!')
              sys.exit(1)
          if failed:
              sys.exit(1)
          print(f'All {checked} source files meet >=80% coverage threshold.')
          "

      - name: Run Health Check
        if: matrix.build_type == 'Release'
        run: ./build/kem_benchmarker health

      - name: Run ML-KEM-768 Demo
        if: matrix.build_type == 'Release'
        run: ./build/kem_benchmarker demo 768

      - name: Run Microbenchmarks
        if: matrix.build_type == 'Release'
        run: ./build/kem_benchmarker bench

      - name: Build Docker Image
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Release'
        run: |
          docker build -t kem:test .

      - name: Docker Smoke Test
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Release'
        run: |
          docker run --rm kem:test health
          docker run --rm kem:test demo 768
